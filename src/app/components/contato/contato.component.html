<section id="contato" class="contato section section--wave" aria-labelledby="contato-title" style="border-radius: 0 0 16px 16px;">
  <div class="section__inner contato__inner">
    <h2 id="contato-title">Ficou interessado?</h2>
    <p class="contato__lead">Entre em contato e reserve sua fornada, conte-nos quantas caixas você quer e quando deseja retirar.</p>
    <button type="button" class="btn btn--primary btn--xl" (click)="openContact()">Entre em contato</button>
  </div>
  <app-section-wave [fill]="waveFill" [accent]="waveAccent" [variant]="5" />
</section>
